<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="woolf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="wave-color" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="800" height="600" fill="url(#woolf-grad)" />
  
  <!-- Abstract ocean waves representing "rooted, but I flow" and "The Waves" -->
  <g fill="none" stroke-linecap="round">
    <!-- Wave 1 -->
    <path d="M -50 200 C 150 100, 300 350, 500 250 C 700 150, 750 320, 850 280 L 850 600 L -50 600 Z" fill="url(#wave-color)" stroke="#2dd4bf" stroke-width="1" opacity="0.3" />
    
    <!-- Wave 2 -->
    <path d="M -50 320 C 100 250, 250 450, 450 350 C 650 250, 700 400, 850 340 L 850 600 L -50 600 Z" fill="url(#wave-color)" stroke="#a78bfa" stroke-width="1.5" opacity="0.4" />
    
    <!-- Wave 3 -->
    <path d="M -50 420 C 80 380, 200 520, 400 450 C 600 380, 680 480, 850 420 L 850 600 L -50 600 Z" fill="url(#wave-color)" stroke="#f472b6" stroke-width="2" opacity="0.2" />
  </g>
  
  <!-- Concentric ripples or light reflections -->
  <circle cx="400" cy="300" r="180" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 8" opacity="0.2" fill="none" />
  <circle cx="400" cy="300" r="220" stroke="#2dd4bf" stroke-width="1" opacity="0.1" fill="none" />

  <!-- Fluid text layout guides / starry sky -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="200" cy="150" r="1.5" />
    <circle cx="250" cy="180" r="1" />
    <circle cx="600" cy="120" r="2" />
    <circle cx="550" cy="200" r="1" />
    <circle cx="680" cy="160" r="1.5" />
    <circle cx="120" cy="220" r="1" />
  </g>

  <!-- Elegant vector typography layout (simulated stream of consciousness lines) -->
  <path d="M 250 260 Q 400 240 550 260" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="1 5" fill="none" opacity="0.4" />
  <path d="M 220 300 Q 400 280 580 300" stroke="#f1f5f9" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M 280 340 Q 400 320 520 340" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="1 5" fill="none" opacity="0.4" />
</svg>
