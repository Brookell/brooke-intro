<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="hergaze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d060a" />
      <stop offset="40%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="800" height="600" fill="url(#hergaze-grad)" />
  
  <!-- Ambient Spotlight -->
  <circle cx="400" cy="300" r="280" fill="url(#eye-glow)" />

  <!-- Abstract Gaze/Aperture lines -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.15">
    <!-- Camera/Eye Circles -->
    <circle cx="400" cy="300" r="180" />
    <circle cx="400" cy="300" r="120" stroke-dasharray="10 15" />
    <circle cx="400" cy="300" r="70" />
    <circle cx="400" cy="300" r="30" />
    
    <!-- Cinematic Frame crop guidelines -->
    <line x1="100" y1="120" x2="700" y2="120" stroke-dasharray="5 5" opacity="0.5" />
    <line x1="100" y1="480" x2="700" y2="480" stroke-dasharray="5 5" opacity="0.5" />
    
    <!-- Ray lines representing cinematic projection / gaze direction -->
    <line x1="400" y1="300" x2="220" y2="120" />
    <line x1="400" y1="300" x2="580" y2="120" />
    <line x1="400" y1="300" x2="220" y2="480" />
    <line x1="400" y1="300" x2="580" y2="480" />
  </g>
  
  <!-- Stylized Rose Gold Abstract Eye Contour -->
  <path d="M 220 300 C 300 200, 500 200, 580 300 C 500 400, 300 400, 220 300 Z" stroke="#fb7185" stroke-width="3" fill="none" opacity="0.4" />
  <circle cx="400" cy="300" r="45" fill="#f43f5e" opacity="0.25" />
  <circle cx="385" cy="285" r="10" fill="#ffffff" opacity="0.6" />
</svg>
