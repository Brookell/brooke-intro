<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
body {
    font-family: "Plus Jakarta Sans", sans-serif;
    -webkit-tap-highlight-color: transparent
    }
/* Custom Pattern Background using IMAGE_2 */
.cat-pattern-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: url(https://lh3.googleusercontent.com/aida/ADBb0ugcFReJRdxfiykfmlSwAQ9Ya8SOilqy81dpL5exoYXzgnqeGh8tcfagzrq68EbSaRfsza9Zu8GGYrPjSquFku9vwzEVwdEFVzrX8m7zyPJgB6g1jDWRKlgbyKeEOjwxFuFSWMiMSbnc0kRYTmNY6EPza-4Mhqv3fpmgpEescnbXAHNOZV_QCqNnFMITY4olqexJzHiNVZOIUVjUWju0k2LLQITcMz-LEgUP2PS5Ic_Lr7yMKc-Zj3ks9D0xFZYGZ-6LHhNe1Ps2_4o);
    background-repeat: repeat;
    background-size: 180px;
    /* Adjusted for subtle tiling */
    opacity: 0.05;
    /* Light opacity for legibility */
    mix-blend-mode: multiply;
    pointer-events: none
    }</style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#6f5b40",
                      "secondary-fixed": "#ffdbce",
                      "on-secondary-fixed": "#2b160f",
                      "on-background": "#1c1c19",
                      "on-primary-fixed": "#271905",
                      "primary-container": "#bda485",
                      "on-secondary-fixed-variant": "#5b4137",
                      "on-error-container": "#93000a",
                      "secondary-fixed-dim": "#e4beb2",
                      "surface": "#fcf9f4",
                      "primary-fixed-dim": "#ddc2a2",
                      "surface-container": "#f0ede9",
                      "on-secondary-container": "#795c51",
                      "surface-container-low": "#f6f3ee",
                      "on-surface-variant": "#4d453d",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed-variant": "#4c4542",
                      "on-error": "#ffffff",
                      "tertiary-container": "#b0a6a2",
                      "primary-fixed": "#fadebc",
                      "on-tertiary-fixed": "#201a18",
                      "surface-dim": "#dcdad5",
                      "surface-container-high": "#ebe8e3",
                      "inverse-primary": "#ddc2a2",
                      "surface-tint": "#6f5b40",
                      "tertiary-fixed": "#ece0dc",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#423c39",
                      "on-primary-container": "#4c3a22",
                      "tertiary": "#655d5a",
                      "on-tertiary": "#ffffff",
                      "error-container": "#ffdad6",
                      "secondary": "#75584d",
                      "surface-container-highest": "#e5e2dd",
                      "inverse-on-surface": "#f3f0eb",
                      "outline-variant": "#d0c5b9",
                      "outline": "#7f766b",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed-dim": "#cfc4c0",
                      "on-primary": "#ffffff",
                      "background": "#fcf9f4",
                      "on-primary-fixed-variant": "#56442b",
                      "surface-variant": "#e5e2dd",
                      "surface-bright": "#fcf9f4",
                      "secondary-container": "#fed7ca",
                      "inverse-surface": "#31302d",
                      "on-surface": "#1c1c19"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Plus Jakarta Sans"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen relative">
<!-- Pattern Overlay Background -->
<div class="cat-pattern-overlay"></div>
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 bg-[#fdfcfb]/80 dark:bg-[#1c1c19]/80 backdrop-blur-xl">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#6f5b40] dark:text-[#bda485]" data-icon="pets">pets</span>
<h1 class="text-2xl font-black text-[#6f5b40] dark:text-[#bda485] tracking-tighter font-['Plus_Jakarta_Sans']">Cat-puccino</h1>
</div>
<button class="p-2 rounded-full hover:bg-stone-200/50 dark:hover:bg-stone-700/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#6f5b40] dark:text-[#bda485]" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="px-6 pb-32 relative z-10">
<!-- Date Navigation Bar -->
<section class="mt-4 mb-8">
<div class="bg-surface-container-low/90 backdrop-blur-sm rounded-full px-6 py-4 flex items-center justify-between shadow-sm border border-white/40">
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="chevron_left">chevron_left</span>
</button>
<div class="text-center">
<span class="block text-[10px] uppercase tracking-[0.2em] font-bold text-outline">Today</span>
<span class="text-lg font-bold text-on-surface tracking-tight">Monday, Oct 23</span>
</div>
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors opacity-30 cursor-not-allowed">
<span class="material-symbols-outlined text-primary" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Empty State Canvas -->
<section class="flex flex-col items-center justify-center min-h-[442px] space-y-8">
<div class="relative group">
<!-- Mascot Container with Asymmetric "Puddle" Shadow -->
<div class="absolute -inset-4 bg-primary-container/10 rounded-[4rem] blur-3xl transform rotate-3 group-hover:rotate-6 transition-transform duration-700"></div>
<div class="relative w-64 h-64 rounded-xl overflow-hidden bg-surface-container-lowest shadow-[0_32px_64px_-12px_rgba(111,91,64,0.12)] border-4 border-surface-container">
<img alt="cute cat mascot" class="w-full h-full object-cover" data-alt="a minimalist flat illustration of a cute fluffy orange cat sitting inside a large white ceramic latte cup with foam ears" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAz4RaLNkN4JKoybP86MFUEqbjVer8K9lXcd0rZlRSI3t8XYO7V9b-2LjSOazF1--A1zQbDHR_1HsTX7oGLhXMbHd6b8ekBSofRBgc92kTknZMmMJybB431i2oH9ZaZ1teWKhydAuPhHNOrIuVKnQLaH8h2FLgkkFx3wX8HFQtWPmcFzAwPAHjcQezHvf_b-1lHB8qr4pWfIK6GSNpK0p-3oaK4IDAl3Hb4_pH1M_5o3ej74RiIGxk9TDwNn_kcZMLKaWJtQXHnGfnU"/>
</div>
<!-- Floating Bubble Decor -->
<div class="absolute -top-4 -right-4 bg-secondary-container p-4 rounded-full shadow-lg transform -rotate-12 animate-bounce">
<span class="material-symbols-outlined text-on-secondary-container text-3xl" data-icon="coffee" style="font-variation-settings: 'FILL' 1;">coffee</span>
</div>
</div>
<div class="text-center space-y-4 max-w-xs">
<h2 class="text-3xl font-extrabold text-on-primary-container leading-tight tracking-tight">
                    What are we drinking today?
                </h2>
<p class="text-on-surface-variant leading-relaxed px-4">
                    Your daily caffeine ritual is waiting to be tracked. Tap the bean to start!
                </p>
</div>
</section>
<!-- Bento Highlights -->
<section class="grid grid-cols-2 gap-4 mt-8">
<div class="bg-surface-container/80 backdrop-blur-md rounded-lg p-6 aspect-square flex flex-col justify-between border border-white/40 shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="water_drop">water_drop</span>
<div>
<p class="text-xs font-bold uppercase tracking-widest text-outline">Hydration</p>
<p class="text-xl font-black text-primary">0.0<span class="text-sm font-normal text-outline">L</span></p>
</div>
</div>
<div class="bg-surface-container/80 backdrop-blur-md rounded-lg p-6 aspect-square flex flex-col justify-between border border-white/40 shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="bolt">bolt</span>
<div>
<p class="text-xs font-bold uppercase tracking-widest text-outline">Energy</p>
<p class="text-xl font-black text-primary">0<span class="text-sm font-normal text-outline">mg</span></p>
</div>
</div>
</section>
</main>
<!-- FAB: Add Drink -->
<button class="fixed right-6 bottom-28 w-16 h-16 bg-gradient-to-br from-primary to-primary-container text-white rounded-full shadow-[0_12px_24px_rgba(111,91,64,0.3)] z-50 flex items-center justify-center transform hover:scale-110 active:scale-90 transition-all group overflow-hidden">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-3xl font-bold" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#fdfcfb]/90 dark:bg-[#1c1c19]/90 backdrop-blur-2xl rounded-t-[3rem] shadow-[0_-8px_32px_rgba(111,91,64,0.08)]">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-[#bda485]/20 text-[#6f5b40] dark:text-[#fdfcfb] rounded-full px-6 py-2 scale-110 transition-all tap-highlight-transparent active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-bold uppercase tracking-widest mt-1">Home</span>
</a>
<!-- Stats -->
<a class="flex flex-col items-center justify-center text-[#6f5b40]/50 dark:text-[#bda485]/50 px-4 py-2 hover:text-[#6f5b40] dark:hover:text-[#bda485] transition-all tap-highlight-transparent active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined" data-icon="equalizer">equalizer</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-bold uppercase tracking-widest mt-1">Stats</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-[#6f5b40]/50 dark:text-[#bda485]/50 px-4 py-2 hover:text-[#6f5b40] dark:hover:text-[#bda485] transition-all tap-highlight-transparent active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-bold uppercase tracking-widest mt-1">Profile</span>
</a>
</nav>
</body></html>
